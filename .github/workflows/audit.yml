# Auditoría FORMAL en CI: leo demostrado correcto vs oráculos independientes,
# a escala (≥3 repos reales) y multi-lenguaje (Python vs `ast`, TypeScript vs `tsc`).
# Una regresión del parser/grafo NO puede mergear.
#
# Cada entrada de la matriz es un job en su propia máquina, en paralelo: en serie eran
# ~27 min (jedi 9,9 + audit_formal 11,5 + oráculo Python 2,9, que (a) repetía). Los
# chequeos de tiempo y RAM (d, e, f) van solos en su máquina: medidos al lado de otro
# trabajo no significan nada.
name: leo-code formal audit
on: [push, pull_request]
jobs:
  formal:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # un rojo no cancela los demás: se ven todos los fallos de una vez
      matrix:
        include:
          - name: "(a) oráculo Python SOUND+COMPLETE (precisión+recall 100%)"
            repos: django/django sympy/sympy scipy/scipy
            run: for r in . /tmp/django /tmp/sympy /tmp/scipy; do python benchmark/oracle.py --repo "$r"; done
          # Resolución (¿a QUÉ def va cada llamada?) con jedi de juez, también por el camino de
          # who_calls/impact/guard: falla si se pierde un solo dependiente o si las exactas
          # bajan del 70% (16/11: django 75,0%, sympy 79,0%). Caché propia y vacía para no
          # depender de un índice que haya en disco.
          - name: "resolución vs jedi: django"
            repos: django/django
            run: LEO_CACHE_DIR="$(mktemp -d)" LEO_WATCH=0 python benchmark/resolution_oracle.py --repo /tmp/django --sample 5000 --gate 70
          - name: "resolución vs jedi: sympy"
            repos: sympy/sympy
            run: LEO_CACHE_DIR="$(mktemp -d)" LEO_WATCH=0 python benchmark/resolution_oracle.py --repo /tmp/sympy --sample 5000 --gate 70
          - name: "(a-ts) oráculo TS vs compilador TypeScript (100%)"
            repos: microsoft/TypeScript
            run: python benchmark/ts_oracle.py /tmp/TypeScript
          - name: "(b, c) cobertura vs coverage.py y mutation testing"
            repos: ""
            run: python benchmark/audit_formal.py --only b,c
          - name: "(d, e, f) SLA a 5M+ LOC, reconstrucción y RAM"
            repos: django/django sympy/sympy scipy/scipy microsoft/TypeScript
            run: python benchmark/audit_formal.py --only d,e,f /tmp/django /tmp/sympy /tmp/scipy /tmp/TypeScript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -e ".[dev]" coverage   # coverage_oracle corre la suite: necesita los extras
      - name: Compilador TypeScript (oráculo TS independiente)
        run: npm install typescript@5     # `node benchmark/ts_oracle.js` requiere tsc
      - name: Clonar repos reales
        run: |
          for slug in ${{ matrix.repos }}; do
            git clone --depth 1 "https://github.com/$slug.git" "/tmp/${slug#*/}"
          done
      - name: ${{ matrix.name }}
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: ${{ matrix.run }}
