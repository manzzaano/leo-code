name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Version matches tag
        run: test "v$(node -p "require('./npm/package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Test
        run: node --test npm/bin/leo-mcp.test.js

      - name: Publish
        working-directory: npm
        run: cp ../README.md README.md && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
