name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # un cuelgue al salir (watchdog en Windows) no debe comerse 6 h
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        install: ['.[dev]']
        include:
          # Windows con la instalación base, como la tiene un usuario: sin torch ni
          # extras http (los dos tests ignorados los importan al cargar).
          - os: windows-latest
            python-version: "3.12"
            install: ". pytest pytest-asyncio jedi"
            pytest-args: "--ignore=tests/test_server_metrics.py --ignore=tests/test_vector_store_lock.py"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ${{ matrix.install }}

      - name: Test
        run: python -m pytest --tb=short -q ${{ matrix.pytest-args }}

      - name: Calidad de get_context con preguntas en lenguaje natural
        run: python benchmark/nl_retrieval_bench.py

      - name: Import smoke test
        run: |
          python -c "from leo_code.core.parser import Capsule, extract_from_file"
          python -c "from leo_code.rag.classifier import classify_task"
          python -c "from leo_code.rag.compressor import compress"
          python -c "from leo_code.engine import compute_context"
          python -c "from leo_code.server.mcp_server import server"
          leo-mcp --version

      - name: npm launcher test
        run: node --test npm/bin/leo-mcp.test.js
