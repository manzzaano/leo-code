[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-code"
version = "0.2.0"
description = "KC-RAG — servidor MCP de contexto de código con grafo estructural verificado (0 alucinación en where/who_calls/impact/trace/guard)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ismael Manzano Leon", email = "manzzaano@pm.me"}]
keywords = ["mcp", "code-search", "static-analysis", "kc-rag", "ast", "call-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "redis>=5",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.7",
    "orjson>=3.9",
    "mcp>=1.0,<2.0",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.urls]
Homepage = "https://github.com/manzzaano/leo-code"
Documentation = "https://github.com/manzzaano/leo-code#readme"
Repository = "https://github.com/manzzaano/leo-code.git"
Issues = "https://github.com/manzzaano/leo-code/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "watchdog>=4",
    "tree-sitter>=0.23",
]

[project.scripts]
leo-code-mcp = "leo_code.server.server:main"
leo-code-mcp-stdio = "leo_code.server.mcp_server:run_stdio"

[tool.setuptools.packages.find]
include = ["leo_code*"]
