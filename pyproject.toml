[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-mcp"
version = "0.3.0"
description = "MCP server that gives your coding agent the real call graph of your repo (where / who_calls / impact / trace / guard, cited file:line) plus compressed AST context."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ismael Manzano Leon", email = "manzzaano@pm.me"}]
keywords = ["mcp", "model-context-protocol", "claude-code", "code-search", "static-analysis", "ast", "call-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base = lo que usa el servidor MCP: grafo estructural + retrieval exact/BM25/scorer.
dependencies = [
    "mcp>=1.0,<2.0",
    "orjson>=3.9",
    "rank-bm25>=0.2",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.urls]
Homepage = "https://github.com/manzzaano/leo-code"
Documentation = "https://github.com/manzzaano/leo-code#readme"
Repository = "https://github.com/manzzaano/leo-code.git"
Issues = "https://github.com/manzzaano/leo-code/issues"

[project.optional-dependencies]
# Recall semántico (torch incluido, ~2 GB): opcional, el grafo no lo necesita.
semantic = ["sentence-transformers>=2.7", "qdrant-client>=1.9"]
# Servidor HTTP opcional (leo_code/server/server.py).
http = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "redis>=5"]
dev = [
    "leo-mcp[semantic,http]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "watchdog>=4",
]

[project.scripts]
leo-mcp = "leo_code.cli:main"
leo-code-mcp-stdio = "leo_code.server.mcp_server:run_stdio"  # alias de compatibilidad
leo-code-mcp = "leo_code.server.server:main"                # HTTP (extra http)

[tool.setuptools.packages.find]
include = ["leo_code*"]
