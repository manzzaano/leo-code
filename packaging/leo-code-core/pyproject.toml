# leo-code-core — el MOTOR compartido (sin agente ni FastAPI).
# Construir:  cd packaging/leo-code-core && python -m build --wheel
[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-code-core"
version = "0.2.0"
description = "KC-RAG — motor determinista de contexto y grafo de codigo (nucleo compartido de leo-code)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.9", "sentence-transformers>=2.7",
    "orjson>=3.9", "redis>=5", "pyyaml>=6",
    "tree-sitter>=0.23", "tree-sitter-typescript>=0.23", "tree-sitter-javascript>=0.23",
]

[tool.setuptools]
package-dir = {"" = "../.."}
py-modules = ["leo_code.engine"]

[tool.setuptools.packages.find]
where = ["../.."]
include = [
    "leo_code", "leo_code.core*",
    "leo_code.rag", "leo_code.rag.indexer*",
]
